<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Flow Model</title>
    <style>
        :root {
            --primary: #DB0011;
            --bg: #F2F2F2;
            --text: #333333;
            --nav-bg: #000000;
            --nav-text: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background: var(--nav-bg);
            padding: 1rem 2rem;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: var(--nav-text);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            margin: 3rem 0 0.6rem;
            letter-spacing: 0.01em;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: var(--primary);
            color: #FFFFFF;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.3rem 0.8rem;
            margin-bottom: 2.5rem;
        }

        .diagram {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0;
            padding: 0 1.5rem;
        }

        .node {
            background: #FFFFFF;
            border-top: 4px solid var(--primary);
            box-shadow: 0 2px 8px rgb(0 0 0 / 0.12);
            padding: 1.5rem 2rem;
            text-align: center;
            min-width: 130px;
        }

        .node-label {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .node-sub {
            font-size: 0.72rem;
            color: #595959;
            margin-top: 0.3rem;
        }

        .arrow {
            display: flex;
            align-items: center;
            padding: 0 4px;
        }

        .arrow-shaft {
            width: 48px;
            height: 2px;
            background: var(--primary);
            position: relative;
        }

        .arrow-shaft::after {
            content: '';
            position: absolute;
            right: -1px;
            top: -5px;
            border-left: 10px solid var(--primary);
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        @media (max-width: 540px) {
            .diagram {
                flex-direction: column;
            }

            .arrow {
                flex-direction: column;
                padding: 4px 0;
            }

            .arrow-shaft {
                width: 2px;
                height: 40px;
            }

            .arrow-shaft::after {
                right: -5px;
                top: auto;
                bottom: -1px;
                border-left: 6px solid transparent;
                border-right: 6px solid transparent;
                border-top: 10px solid var(--primary);
                border-bottom: none;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="helloworld.html">Hello World</a>
        <a href="model.html">Model</a>
    </nav>

    <h1 class="page-title">Data Flow Model</h1>
    <span class="badge">Advisory Reference Model</span>

    <div class="diagram">

        <div class="node">
            <div class="node-label">ISM / PRD</div>
            <div class="node-sub">Source</div>
        </div>

        <div class="arrow">
            <div class="arrow-shaft"></div>
        </div>

        <div class="node">
            <div class="node-label">iHub</div>
            <div class="node-sub">Integration Hub</div>
        </div>

        <div class="arrow">
            <div class="arrow-shaft"></div>
        </div>

        <div class="node">
            <div class="node-label">Aladdin Wealth</div>
            <div class="node-sub">Destination</div>
        </div>

    </div>

</body>
</html>
